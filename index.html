$("tabs").onclick=e=>{const k=e.target.dataset.i;if(k!==undefined)start(+k)};
function start(n){if(!$("name").value.trim()){alert("اكتب اسمك الأول");return}
if(cur>=0&&A.length&&A.some(x=>x!==null)&&!done&&!confirm("هتبدأ امتحان جديد وتفقد تقدمك الحالي. متأكد؟"))return;
cur=n;i=0;done=false;A=Array(E[n].length).fill(null);t0=Date.now();clearInterval(tick);
tick=setInterval(()=>{const t=$("tm");if(t)t.textContent="⏱ "+fmt((Date.now()-t0)/1000|0)},1000);
document.querySelectorAll("#tabs button").forEach((b,k)=>b.className=k==n?"on":"sec");render()}
let done=false;
function stats(){let c=0,w=0;E[cur].forEach((q,k)=>{if(A[k]!==null){q.o[A[k]]===q.a?c++:w++}});return[c,w]}
function render(){const q=E[cur][i],n=E[cur].length,[c,w]=stats(),t=c+w,p=t?Math.round(c/t*100):0,ans=A[i]!==null;
$("stage").innerHTML=`<div class="row2"><span>سؤال ${i+1} من ${n}</span><span id="tm">⏱ ${fmt((Date.now()-t0)/1000|0)}</span></div>
<div class="score"><span class="g">✅ صح: ${c}</span><span class="r">❌ غلط: ${w}</span></div>
<div class="rbar">${t?`<div class="gr" style="width:${p}%"></div><div class="rd" style="width:${100-p}%"></div>`:""}</div>
<div class="q"><p>${q.q}</p>${q.o.map((o,j)=>{let cl="";if(ans){if(o===q.a)cl="ok";else if(j===A[i])cl="bad"}return `<label class="${cl}"><input type="radio" name="o" data-j="${j}" ${A[i]===j?"checked":""} ${ans?"disabled":""}> ${o}</label>`}).join("")}</div>
<div class="nav"><button class="sec" id="pv" ${i==0?"disabled":""}>◀ السابق</button><button id="nx" ${!ans?"disabled":""}>${i==n-1?"تسليم ✔":"التالي ▶"}</button></div>`}
$("stage").onchange=e=>{if(e.target.name!=="o"||A[i]!==null)return;A[i]=+e.target.dataset.j;render()};
$("stage").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
if(b.id==="pv"){i--;render()}else if(b.id==="nx"){if(i==E[cur].length-1)finish();else{i++;render()}}else if(b.id==="again")start(cur)};
async function finish(){clearInterval(tick);done=true;const end=Date.now(),secs=Math.round((end-t0)/1000),Q=E[cur],n=Q.length;
let s=0,rv="";Q.forEach((q,k)=>{if(q.o[A[k]]===q.a)s++;else rv+=`<div class="rv">${k+1}. ${q.q}<br>إجابتك: <b class="r">${q.o[A[k]]}</b><br>الصحيحة: <b class="g">${q.a}</b></div>`});
let att=1;try{att=(await store.all()).filter(r=>r.uid===uid&&r.exam===cur+1).length+1}catch(e){}
const pct=Math.round(s/n*100);
$("stage").innerHTML=`<div class="big">${s} / ${n} (${pct}%)</div><div class="row2"><span>الامتحان ${cur+1} - المحاولة ${att}</span><span>المدة ${fmt(secs)}</span></div><button id="again" style="margin:12px 0">محاولة جديدة</button>${rv?"<b>الأسئلة اللي غلطت فيها:</b>"+rv:"<div class='big'>🏆 ممتاز! كل الإجابات صح</div>"}`;
try{await store.save(uid+"_"+cur+"_"+end,{uid,name:$("name").value.trim(),exam:cur+1,attempt:att,score:s,total:n,pct,secs,start:t0,end})}catch(e){$("note").textContent="الدرجة ظهرت لك بس ماتسجلتش."}
if(!$("board").hidden)draw()}
async function draw(){try{const f=+$("fl").value;const l=(await store.all()).filter(r=>!f||r.exam===f).sort((x,y)=>x.exam-y.exam||y.score-x.score||x.secs-y.secs);
$("empty").hidden=l.length>0;const tb=$("rows");tb.textContent="";
l.forEach((r,k)=>{const tr=document.createElement("tr");[k+1,r.name,"امتحان "+r.exam,r.attempt,`${r.score}/${r.total}`,r.pct+"%",fmt(r.secs),new Date(r.end).toLocaleString("ar-EG")].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)})}catch(e){$("empty").hidden=false;$("empty").textContent="تعذّر تحميل الدرجات."}}
$("fl").onchange=draw;
$("tg").onclick=()=>{const b=$("board");b.hidden=!b.hidden;clearInterval(timer);if(!b.hidden){draw();timer=setInterval(draw,5000)}};
</script></body></html>
